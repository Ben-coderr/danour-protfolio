name: Feature Request
description: Propose a new case study, feature, or enhancement
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: Have an idea to make this portfolio or platform even better?
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature
      description: Describe what you would like to see added.
    validations:
      required: true
